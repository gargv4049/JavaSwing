
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef7f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: #ffffff;
            width: 380px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h2 {
            color: #198754;
            margin-bottom: 5px;
            font-weight: bold;
        }

        h3 {
            color: #555;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .info {
            font-size: 14px;
            color: #444;
            margin: 4px 0;
        }

        hr {
            border: 0;
            border-top: 1px solid #ddd;
            margin: 15px 0 20px;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        select {
            width: 100%;
            padding: 11px;
            margin-bottom: 15px;
            border: 1px solid #bbb;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #198754;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 5px;
        }

        input[type="submit"],
        input[type="reset"] {
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="submit"] {
            background: #198754;
        }

        input[type="reset"] {
            background: #6c757d;
        }

        input[type="submit"]:hover {
            background: #146c43;
        }

        input[type="reset"]:hover {
            background: #545b62;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>USER INPUT FORM</h2>
    <h3>STUDENT REGISTRATION</h3>

    <div class="info">Guided By: Er. Ram Babu Buri</div>
    <div class="info">Developed By: Vivek Garg (24EARCS186)</div>

    <hr>

    <form action="hello" method="post">

        <input type="text"
               name="username"
               placeholder="Enter your name"
               required>

        <input type="number"
               name="age"
               placeholder="Enter your age"
               required>

        <input type="email"
               name="email"
               placeholder="Enter your email"
               required>

        <select name="gender" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <select name="course" required>
            <option value="" disabled selected>Select Course</option>
            <option value="B.Tech">B.Tech</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="M.Tech">M.Tech</option>
        </select>

        <select name="branch" required>
            <option value="" disabled selected>Select Branch</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Electronics">Electronics</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
        </select>

        <div class="btn-group">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>

    </form>

</div>

</body>
</html>
